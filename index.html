<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Emberwilds</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;800;900&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #07060d;
        font-family: "Spectral", Georgia, serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        /* atmospheric backdrop behind the letterboxed canvas */
        background:
          radial-gradient(120% 80% at 50% 0%, #1a1326 0%, #0b0a14 45%, #050409 100%);
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #game canvas {
        image-rendering: auto;
        box-shadow:
          0 0 0 1px rgba(120, 90, 60, 0.18),
          0 30px 90px -20px rgba(0, 0, 0, 0.9),
          0 0 140px -10px rgba(255, 138, 42, 0.08);
        border-radius: 4px;
      }
      /* loading shimmer shown until Phaser boots */
      #preload {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.4rem;
        color: #c9bfa8;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        font-size: 0.7rem;
        transition: opacity 0.6s ease;
        pointer-events: none;
      }
      #preload.hide {
        opacity: 0;
      }
      #preload .title {
        font-family: "Cinzel", serif;
        font-weight: 800;
        font-size: 2.2rem;
        letter-spacing: 0.35em;
        color: #f0e6d2;
        text-shadow: 0 0 24px rgba(255, 138, 42, 0.45);
      }
      #preload .ember {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #ff8a2a;
        box-shadow: 0 0 16px 4px rgba(255, 138, 42, 0.7);
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(0.6); opacity: 0.4; }
        50% { transform: scale(1.3); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="preload">
      <div class="title">EMBERWILDS</div>
      <div class="ember"></div>
      <div>kindling the world</div>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
